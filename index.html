    <!-- Dynamic Head Title Script (Updates on Section Scroll, Hash Navigation & Tab Visibility) -->
    <script>
      (function () {
        var BASE_NAME = 'Kelvin Maro U.';
        var DEFAULT_TITLE = 'Kelvin Maro U. | AI Product Engineer & Healthcare Systems Builder';
        var SECTION_TITLES = {
          hero: DEFAULT_TITLE,
          about: 'About & Impact Stats | ' + BASE_NAME + ' — AI Product Engineer',
          skills: 'AI, Full-Stack & Healthcare IT Skills | ' + BASE_NAME,
          projects: 'Featured Projects & Case Studies | ' + BASE_NAME,
          experience: 'Experience & Leadership Timeline | ' + BASE_NAME,
          services: 'RUVIN IT Consulting Services & AI Agents | ' + BASE_NAME,
          contact: 'Hire or Contact ' + BASE_NAME + ' | AI Product Engineer'
        };

        window.__setPortfolioTitle = function (sectionId) {
          if (document.hidden) return;
          var nextTitle = SECTION_TITLES[sectionId] || DEFAULT_TITLE;
          if (document.title !== nextTitle) {
            document.title = nextTitle;
          }
        };

        document.addEventListener('visibilitychange', function () {
          if (document.hidden) {
            document.title = 'Let’s Build Practical AI — ' + BASE_NAME + ' (KM.)';
          } else {
            var hash = (window.location.hash || '#hero').replace('#', '');
            window.__setPortfolioTitle(hash || 'hero');
          }
        });
      })();
    </script>
